# ─────────────────────────────────────────────────────────────────────────────
# NexChat — Prometheus Scrape Configuration
# Targets: backend, node-exporter, cadvisor, redis-exporter, prometheus itself
# ─────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s
  external_labels:
    cluster: 'nexchat-local'
    environment: 'production'

# ── Alerting Rules ─────────────────────────────────────────────────────────────
rule_files:
  - "/etc/prometheus/rules/*.yml"

# ── Scrape Targets ─────────────────────────────────────────────────────────────
scrape_configs:

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # NexChat Backend (Node.js + prom-client)
  - job_name: 'nexchat-backend'
    static_configs:
      - targets: ['backend:5000']
        labels:
          service: 'backend'
          language: 'nodejs'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Host metrics via node-exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'host'
    scrape_interval: 15s

  # Container metrics via cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'containers'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Redis metrics via redis-exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
    scrape_interval: 15s

  # MongoDB metrics (if mongo-exporter is added later)
  # - job_name: 'mongodb'
  #   static_configs:
  #     - targets: ['mongo-exporter:9216']
  #   scrape_interval: 30s
