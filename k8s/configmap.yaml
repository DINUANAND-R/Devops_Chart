apiVersion: v1
kind: ConfigMap
metadata:
  name: nexchat-config
  namespace: nexchat
  labels:
    app.kubernetes.io/name: nexchat
data:
  # ── Server ───────────────────────────────────────────────────────────────────
  NODE_ENV:               "production"
  PORT:                   "5000"

  # ── Database ─────────────────────────────────────────────────────────────────
  MONGO_URI:              "mongodb://mongodb-service:27017/chatapp"
  REDIS_URL:              "redis://redis-service:6379"

  # ── JWT ──────────────────────────────────────────────────────────────────────
  JWT_EXPIRES_IN:         "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"

  # ── App ──────────────────────────────────────────────────────────────────────
  CLIENT_URL:             "http://localhost"
  BASE_URL:               "http://localhost"
  UPLOAD_DIR:             "uploads"
  MAX_FILE_SIZE:          "10485760"
