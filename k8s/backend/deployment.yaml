apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nexchat
  labels:
    app: backend
    app.kubernetes.io/name: nexchat
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5000"
    spec:
      # ── Security context ─────────────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: backend
          image: ghcr.io/dinuanand-r/nexchat-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000

          # ── Environment from ConfigMap + Secrets ────────────────────────────
          envFrom:
            - configMapRef:
                name: nexchat-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nexchat-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: nexchat-secrets
                  key: JWT_REFRESH_SECRET

          # ── Resource limits ─────────────────────────────────────────────────
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # ── Liveness probe — restart if server crashes ───────────────────────
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5

          # ── Readiness probe — only send traffic when ready ──────────────────
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3

          # ── Startup probe — extra time on cold boot ─────────────────────────
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            failureThreshold: 10
            periodSeconds: 5

          # ── Volume mounts ───────────────────────────────────────────────────
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: logs
              mountPath: /app/logs

          # ── Security ────────────────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
        - name: logs
          emptyDir: {}

      restartPolicy: Always
